name: Pages

# Publishes the playground (`npm run build:playground`) to GitHub Pages on
# every push to main. One-time prerequisite: repo Settings -> Pages -> Source
# = "GitHub Actions".

on:
  push:
    branches: [main]
    paths: [playground/**, src/**, models/**, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:playground
      - uses: actions/upload-pages-artifact@v4
        with:
          path: playground-dist
      - id: deployment
        uses: actions/deploy-pages@v4
