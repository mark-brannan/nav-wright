name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # tsconfig.build.json (declaration emit, src-only) is otherwise never
      # exercised: a declaration-emit-only error, or a bad import specifier in
      # the emitted ESM, would pass typecheck and tests and still break every
      # consumer of the published package.
      - run: npm run build

  # `npm run render` (#128): every scene in playground/namedScenes.json as a
  # PNG plus contact-sheet.png, uploaded as the `renders` artifact. Headless
  # Chromium draws WebGL on SwiftShader, so no GPU is needed. A measurement,
  # not a gate, so it stays out of ci-gate's needs. Local: about 40 s.
  render:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run render
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/
          if-no-files-found: ignore

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  prose-budget:
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main
    with:
      require-config: false

  # A measurement, not a gate, so it stays out of ci-gate's needs. Writes the
  # sticky PR comment, hence pull-requests: write.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [check, nonempty, prose-budget]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
